name = "tensor-station"
version = "1.0.0"
description = "Node-based diffusion model orchestration platform"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ryan Vo", email = "ryandtvo@gmail.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.35",
    "alembic==1.13.2",
    "aiosqlite==0.20.0",
    "httpx==0.28.1",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.12",
    "email-validator==2.2.0",
    "torch==2.5.0",
    "torchvision==0.20.0",
    "safetensors==0.5.2",
    "Pillow==11.0.0",
    "numpy==2.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.23.7",
    "pytest-httpx==0.27.0",
    "pytest-cov==6.0.0",
    "faker==33.1.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]